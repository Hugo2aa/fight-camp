<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fight Camp</title>
<meta name="theme-color" content="#0d0c0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fight Camp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="lib/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: fight-night poster. Ink black canvas with chain-link texture, blood red for action, belt gold for wins.
   Layout: mobile app, header + scrolling view + fixed bottom nav (5 tabs). Single dark theme by choice. */
:root{
  --ink:#0d0c0c;
  --panel:#171515;
  --line:#2c2827;
  --bone:#efe7dc;
  --muted:#a39890;
  --red:#d7262e;
  --gold:#d9a43a;
  --ok:#4fb07a;
  --warn:#e08a2c;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:var(--ink);overflow-x:hidden}
body{overflow-x:hidden;overscroll-behavior-y:none}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:var(--ink)}
.brand{font-family:var(--display);font-size:26px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand span{color:var(--red)}
.sub{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sync{background:none;border:0;font-family:var(--body);cursor:pointer;padding:6px 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)} .sync.local i{background:var(--warn)}
main{flex:1;padding:16px 16px calc(130px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
main > *{flex-shrink:0}
nav{position:fixed;z-index:30;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr 1fr;background:#0a0909f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(6px)}
nav button{background:none;border:0;color:var(--muted);font-family:var(--body);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--bone)}
nav button[aria-current="page"] svg{color:var(--red)}
h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-family:var(--body);font-size:14px;color:var(--muted);margin-left:3px}
.stat{display:flex;flex-direction:column;gap:4px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;border-radius:4px;border:1px solid var(--line);background:#221f1e;color:var(--bone);padding:10px 14px;cursor:pointer}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
textarea{resize:vertical}
input,select,textarea{font-family:var(--body);font-size:17px;background:#0f0e0e;color:var(--bone);border:1px solid var(--line);border-radius:4px;padding:10px;width:100%;min-width:0}
.row > input{flex:1;width:auto}
.row > input[type=checkbox]{flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);flex:1;min-width:0}
/* Hero poster */
.poster{position:relative;border-radius:6px;overflow:hidden;min-height:min(78vh,620px);display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);background:#120f0f}
.poster canvas,.poster img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster img.bg{filter:grayscale(.35) contrast(1.08) brightness(.85)}
.poster .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,12,12,0) 0%,rgba(13,12,12,0) 48%,rgba(13,12,12,.6) 70%,rgba(13,12,12,.95) 100%)}
.poster .in{position:relative;padding:20px 18px 18px;display:flex;flex-direction:column;gap:10px}
.tag{align-self:flex-start;background:var(--red);color:#fff;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px}
.quote{font-family:var(--display);text-transform:uppercase;font-size:clamp(26px,7.4vw,38px);line-height:1.02;letter-spacing:.005em;margin:0;text-wrap:balance}
.author{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--gold)}
.poster .row{margin-top:4px}
@media (prefers-reduced-motion:no-preference){
  .poster .quote{animation:punch .5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes punch{from{transform:translateX(-14px);opacity:.25}to{transform:none;opacity:1}}
}
/* streak */
.streak{display:flex;gap:4px}
.streak b{flex:1;height:26px;border-radius:2px;background:#221f1e;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:600}
.streak b.done{background:var(--red);color:#fff}
.streak b.part{background:#4a2222;color:var(--bone)}
.streak b.today{outline:1px solid var(--gold)}
/* habits */
.habit{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.habit:last-child{border-bottom:0}
.habit input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:26px;height:26px;border:2px solid var(--muted);border-radius:3px;flex:none;display:flex;align-items:center;justify-content:center}
.habit input:checked + .box{background:var(--red);border-color:var(--red)}
.habit input:checked + .box::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.habit input:checked ~ span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red)}
.habit input:focus-visible + .box{outline:2px solid var(--gold);outline-offset:2px}
/* bars */
.bar{height:10px;background:#221f1e;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bone);border-radius:2px}
.bar.p i{background:var(--red)} .bar.over i{background:var(--warn)}
.macro{display:flex;flex-direction:column;gap:5px}
.macro .row{font-size:14px}
.meal{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.meal:last-child{border-bottom:0}
.meal .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#1f1c1b;color:var(--bone);border-radius:999px;padding:6px 12px;font-family:var(--body);font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;line-height:1}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:#221a12;font-size:15px;border-radius:0 4px 4px 0}
.note.good{border-color:var(--ok);background:#13201a}
canvas.chart{width:100%;height:220px;display:block}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery figure{margin:0;position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:#221f1e}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .x{position:absolute;top:2px;right:2px;background:#000a;border-radius:3px;color:#fff;font-size:16px}
.qlist{display:flex;flex-direction:column}
.qitem{padding:12px 0;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem p{margin:0 0 4px;font-size:17px}
.qitem .author{font-size:12px}
.water{display:flex;gap:3px}
.water b{flex:1;height:22px;background:#1b2226;border-radius:2px}
.water b.f{background:#3d8fb8}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bone);color:#111;font-weight:700;padding:10px 16px;border-radius:4px;font-size:15px;z-index:9;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);font-family:var(--display);text-transform:uppercase;font-size:18px;padding:10px;cursor:pointer;letter-spacing:.03em}
.seg.sm button{font-size:15px;padding:9px 4px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--red);color:#fff}
.ai{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted)}
.ai .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
@media (prefers-reduced-motion:no-preference){.ai .dot{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.err{color:var(--warn);font-size:15px}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:4px;display:block}
.item{display:grid;grid-template-columns:1fr 76px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{padding:6px 8px;text-align:right}
.item .src{font-size:12px;color:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.totals .num{font-size:22px}
.res{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--bone);font-family:var(--body);font-size:16px;text-align:left;cursor:pointer}
.res .m{font-size:12px;color:var(--muted);white-space:nowrap}
.dish h2{font-size:24px}
.dish ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.dish ul{margin:0;padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:3px}
.cite{font-size:12px;color:var(--muted)}
label.btn{display:inline-flex;justify-content:center;align-items:center;cursor:pointer}
.gear{background:none;border:1px solid var(--line);border-radius:999px;height:36px;padding:0 12px 0 9px;gap:6px;font-family:var(--body);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--bone);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.gear svg{width:18px;height:18px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom) + 76px);width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(215,38,46,.45),0 0 0 4px var(--ink);cursor:pointer;z-index:5}
.fab svg{width:28px;height:28px}
.fab.off{display:none}
.card.hi{border-color:#4a2224;background:linear-gradient(180deg,#1d1515,var(--panel) 60%)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.fightbar{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ringwrap{position:relative;width:118px;height:118px;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .c .num{font-size:36px}
.ringwrap .c .lbl{font-size:10px;letter-spacing:.06em;text-align:center;max-width:84px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.mini .ringwrap{width:58px;height:58px}
.mini .ringwrap .c{font-family:var(--display);font-size:15px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--bone);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;text-align:center;line-height:1.1}
.act svg{width:24px;height:24px;color:var(--red)}
.progress{height:8px;background:#221f1e;border-radius:4px;overflow:hidden;position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:4px}
.ex{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ex:last-child{border-bottom:0}
.ex .presc{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex .logrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.ex .logrow input{padding:8px}
.adv{background:#15120f;border:1px solid #3b2e17;border-radius:4px;padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.adv b.k{font-family:var(--display);font-size:26px;color:var(--gold);font-weight:400}
.routine{display:flex;justify-content:space-between;gap:12px;align-items:center}
.player{position:fixed;inset:0;background:var(--ink);z-index:20;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);gap:16px;max-width:560px;margin:0 auto}
.player .big{font-family:var(--display);font-size:clamp(80px,24vw,130px);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.player .pname{font-family:var(--display);text-transform:uppercase;font-size:34px;line-height:1.02;text-align:center;text-wrap:balance}
.player .cue{color:var(--muted);text-align:center;font-size:18px;max-width:40ch;margin:0 auto}
.player .ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:auto;flex:none}
.player .ctrl .btn{padding:16px 8px;font-size:16px}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:5px;background:#221f1e;border-radius:2px}
.steps i.d{background:var(--red)} .steps i.c{background:var(--gold)}
.wp{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.wp img{width:150px;aspect-ratio:1170/2532;object-fit:cover;border-radius:14px;border:2px solid var(--line);display:block}
@media (max-width:380px){.wp{grid-template-columns:120px 1fr}.wp img{width:120px}}
.stp{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stp:last-child{border-bottom:0}
.stp .n{font-family:var(--display);font-size:20px;color:var(--red);width:22px;flex:none;line-height:1.2}
.vid{display:inline-flex;align-items:center;gap:5px;flex:none;border:1px solid #5a2326;background:#2a1314;color:var(--bone);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.05em}
.vid svg{color:var(--red)}
.seg{position:sticky;top:var(--hh,70px);z-index:10;background:var(--ink);box-shadow:0 -8px 0 var(--ink)}
.marks{display:flex;justify-content:space-between;position:relative;padding-top:4px}
.marks::before{content:"";position:absolute;left:14px;right:14px;top:17px;height:2px;background:var(--line)}
.mark{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:relative;width:20%;text-align:center}
.mark i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#111}
.mark.ok{color:var(--gold)} .mark.ok i{background:var(--gold);border-color:var(--gold)}
.pill{font-size:13px;font-weight:700;padding:3px 8px;border-radius:999px;background:#221f1e;color:var(--muted);font-variant-numeric:tabular-nums}
.pill.good{background:#13281c;color:var(--ok)} .pill.bad{background:#2b1d10;color:var(--warn)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ba figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:#221f1e}
.ba img{width:100%;height:100%;object-fit:cover;display:block}
.ba figcaption{position:absolute;left:6px;bottom:6px;background:#000b;color:var(--bone);font-size:12px;font-weight:700;padding:3px 7px;border-radius:3px;text-transform:uppercase}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x mandatory}
.thumb{flex:none;width:92px;background:none;border:0;padding:0;color:var(--bone);font-family:var(--body);font-size:12px;font-weight:600;display:flex;flex-direction:column;gap:5px;align-items:center;cursor:pointer;scroll-snap-align:start}
.thumb img{width:92px;aspect-ratio:1170/2532;border-radius:10px;border:2px solid var(--line);background:#1b1717;object-fit:cover;display:block}
.thumb:focus-visible img,.thumb:hover img{border-color:var(--red)}
.agenda{display:flex;flex-direction:column}
.agday{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.agday:last-child{border-bottom:0}
.agd{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.agd b{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.agd span{font-family:var(--display);font-size:24px}
.agday.today .agd span{color:var(--red)}
.agl{display:flex;flex-direction:column;gap:6px;min-width:0}
.agi{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:4px;background:#1f1c1b;border-left:3px solid var(--red)}
.agi.k-flex{border-left-color:var(--gold)} .agi.k-cardio{border-left-color:#3d8fb8} .agi.k-combat{border-left-color:var(--bone)} .agi.k-autre{border-left-color:var(--muted)}
.agt{font-weight:700}
.nextp{border-left:3px solid var(--gold);padding-left:10px}
.tapper{background:#1b1717;border:2px solid var(--line);border-radius:50%;width:min(70vw,280px);aspect-ratio:1;align-self:center;color:var(--bone);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.tapper:active{transform:scale(.97);border-color:var(--red)}
.tapper.done{border-color:var(--gold)}
.ytf{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:6px;overflow:hidden;background:#000;cursor:pointer}
.ytf img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.ytp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:44px;border-radius:12px;background:var(--red);display:flex;align-items:center;justify-content:center}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stx{border-bottom:1px solid var(--line)}
.stx:last-child{border-bottom:0}
.stx summary{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer}
.stx summary::-webkit-details-marker{display:none}

<script>

const CLASSES = [["Mouche",56.7],["Coq",61.2],["Plume",65.8],["Léger",70.3],["Welter",77.1],["Moyen",83.9],["Mi-lourd",93.0],["Lourd",120.2]];
const DEFAULT_HABITS = [
  ["h_sleep","Dormir 7 h ou plus"],["h_water","Objectif d'eau atteint"],["h_prot","Protéines à chaque repas"],
  ["h_junk","Zéro sucre / junk food"],["h_train","Séance du coach faite"],["h_flex","Souplesse 10 min"],["h_weigh","Pesée du matin notée"],["h_alc","Pas d'alcool"]
];

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dkey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmt1 = n => (Math.round(n*10)/10).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmt0 = n => Math.round(n).toLocaleString("fr-FR");
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? n : null; };
const uid = () => Math.random().toString(36).slice(2,10);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }

/* ---------- État ---------- */
let profile = {
  sex:"h", age:null, height:null, startWeight:null, goalWeight:null, goalDate:"", weightClass:"",
  activity:1.6, deficit:20, kcalOverride:null, protOverride:null,
  habits: DEFAULT_HABITS.map(([id,label])=>({id,label})),
  weights:[], favorites:[], photos:[], extraQuotes:[], recipes:[], avoid:""
};
const days = {}; // key -> {habits:{}, meals:[], water:0}
let tab = "today";
let quoteOffset = 0;

function ensureTraining(){ const d = day(); const ts = todaySession(); if (!d.training) d.training = {idx: ts ? ts.idx : 0, logs:{}}; d.training.logs = d.training.logs || {}; return d.training; }
function day(k=dkey()){ if(!days[k]) days[k] = {habits:{}, meals:[], water:0}; return days[k]; }
function currentWeight(){ const w=[...profile.weights].sort((a,b)=>a.d<b.d?-1:1); return w.length ? w[w.length-1].kg : profile.startWeight; }

function targets(){
  const w = currentWeight();
  let kcal = null, bmr = null, tdee = null;
  if (w && profile.height && profile.age){
    bmr = 10*w + 6.25*profile.height - 5*profile.age + (profile.sex==="h" ? 5 : -161);
    tdee = bmr * profile.activity;
    kcal = tdee * (1 - profile.deficit/100);
  }
  if (profile.kcalOverride) kcal = profile.kcalOverride;
  const prot = profile.protOverride || (w ? Math.round(w*2.2) : null);
  const fat = w ? Math.round(w*0.8) : null;
  const carbs = (kcal && prot && fat) ? Math.max(0, Math.round((kcal - prot*4 - fat*9)/4)) : null;
  const water = w ? Math.round(w*35/250)*250 : 2500;
  return {kcal: kcal ? Math.round(kcal/10)*10 : null, prot, fat, carbs, water, bmr, tdee};
}
function dayScore(k){
  const d = days[k]; if(!d) return 0;
  const hs = profile.habits; if(!hs.length) return 0;
  return hs.filter(h=>d.habits[h.id]).length / hs.length;
}
function streak(){
  let n=0, d=new Date();
  if (dayScore(dkey(d)) < .8) d = addDays(d,-1); // la journée en cours ne casse pas la série
  while (dayScore(dkey(d)) >= .8){ n++; d = addDays(d,-1); }
  return n;
}

/* ---------- Stockage : Supabase (synchro) + cache sur le téléphone ---------- */
const SUPA_URL = "https://gquetzrmbbiwavzrpsmk.supabase.co";
const SUPA_KEY = "sb_publishable_EuhC-LJBWoTpSBDR93-KMg_dZCl9gt-";
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
const store = { mode:"loading", uid:null, session:null, timers:{}, chains:{} };
function setSync(mode){
  store.mode = mode;
  const el = $("#sync");
  el.className = "sync " + (mode==="db" ? "on" : mode==="local" ? "local" : "");
  el.querySelector("span").textContent = mode==="db" ? "Synchronisé" : mode==="local" ? "Hors ligne" : "Connexion…";
}
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const dirty = new Set(lsGet("fc:dirty") || []);
const saveDirty = () => lsSet("fc:dirty", [...dirty]);

async function pushDoc(docId){
  if (!store.uid) return;
  const body = docId==="profile" ? profile : days[docId.slice(2)];
  if (!body) { dirty.delete(docId); saveDirty(); return; }
  const {error} = await sb.from("docs").upsert({user_id:store.uid, id:docId, body:JSON.parse(JSON.stringify(body)), updated_at:new Date().toISOString()});
  if (error){ setSync("local"); throw error; }
  dirty.delete(docId); saveDirty(); setSync("db");
}
function persist(docId){
  clearTimeout(store.timers[docId]);
  store.timers[docId] = setTimeout(()=>{
    const body = docId==="profile" ? profile : days[docId.slice(2)];
    lsSet("fc:"+docId, JSON.parse(JSON.stringify(body)));
    dirty.add(docId); saveDirty();
    store.chains[docId] = (store.chains[docId] || Promise.resolve()).then(()=>pushDoc(docId)).catch(()=>{});
  }, 600);

/* ---------- IA : relais Supabase vers l'API Claude ---------- */
const MODEL_PRECIS = "claude-sonnet-5-5", MODEL_ECO = "claude-haiku-5-5";
function blobToB64(b){ return new Promise(r=>{ const fr = new FileReader(); fr.onload = ()=>r(String(fr.result).split(",")[1]); fr.readAsDataURL(b); }); }
function parseLoose(t){
  try{ return JSON.parse(t); }catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try{ return JSON.parse(f[1]); }catch(e){} }
  const a = t.search(/[\[{]/), z = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a>=0 && z>a){ try{ return JSON.parse(t.slice(a, z+1)); }catch(e){} }
  throw {code:"invalid_json", text:t};
}
async function callEdge(payload, signal){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) throw {code:"session_expired"};
  let r;
  try{
    r = await fetch(SUPA_URL + "/functions/v1/ai", {method:"POST", signal,
      headers:{"Authorization":"Bearer "+session.access_token, "apikey":SUPA_KEY, "Content-Type":"application/json"},
      body: JSON.stringify(payload)});
  }catch(e){ throw {code: e && e.name==="AbortError" ? "cancelled" : "upstream_error"}; }
  const body = await r.json().catch(()=>({}));
  if (r.ok) return body;
  const msg = (body.error && (body.error.message || body.error)) || "";
  if (r.status===401) throw {code:"session_expired"};
  if (r.status===403) throw {code:"not_granted"};
  if (msg==="cle_manquante") throw {code:"no_key"};
  if (/credit balance/i.test(msg)) throw {code:"no_credit"};
  if (r.status===429) throw {code:"rate_limited"};
  throw {code:"upstream_error", message:String(msg)};
}
const PRICES = {"claude-sonnet-5-5":[2,10], "claude-haiku-5-5":[.1,.5]};   // $ par million de tokens (entrée, sortie)
const monthKey = () => dkey().slice(0,7);
function usage(){ const m = monthKey(); if (!profile.aiUsage || profile.aiUsage.month !== m) profile.aiUsage = {month:m, cost:0, calls:0, feat:{}}; return profile.aiUsage; }
function trackUsage(model, u, feat){
  if (!u) return; const pr = PRICES[model] || [2,10];
  const cost = ((u.input_tokens||0) + (u.cache_creation_input_tokens||0)*1.25 + (u.cache_read_input_tokens||0)*.1) * pr[0] / 1e6 + (u.output_tokens||0) * pr[1] / 1e6;
  const us = usage(); us.cost += cost; us.calls += 1; us.feat[feat||"autre"] = (us.feat[feat||"autre"]||0) + cost; saveProfile();
}
function budgetLeft(){ const b = profile.aiBudget || 0; return b ? b - usage().cost : Infinity; }
async function aiJson(prompt, opts={}){
  if (budgetLeft() <= 0) throw {code:"budget"};
  const content = [];
  for (const b of (opts.images||[])) content.push({type:"image", source:{type:"base64", media_type:"image/jpeg", data: await blobToB64(b)}});
  content.push({type:"text", text: prompt + "\n\nRéponds uniquement avec le JSON demandé, sans aucun texte autour."});
  const messages = [{role:"user", content}];
  const tools = opts.tools || null;
  const apiTools = tools ? tools.map(t=>({name:t.name, description:t.description, input_schema:t.inputSchema})) : undefined;
  for (let round=0; round<4; round++){
    const last = round===3;
    const r = await callEdge({model: opts.model || MODEL_ECO, max_tokens: opts.max_tokens || 4000, messages, tools: apiTools, tool_choice: apiTools && last ? {type:"none"} : undefined}, opts.signal);
    trackUsage(opts.model || MODEL_ECO, r.usage, opts.feat);
    messages.push({role:"assistant", content:r.content});
    const uses = (r.content||[]).filter(c=>c.type==="tool_use");
    if (!tools || !uses.length || r.stop_reason!=="tool_use"){
      const text = (r.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
      if (!text.trim()) throw {code:"empty_completion"};
      return parseLoose(text);
    }
    const results = [];
    for (const u of uses){
      const t = tools.find(x=>x.name===u.name); let out;
      try{ out = JSON.stringify(await t.execute(u.input||{}, {signal:opts.signal})); }catch(e){ out = "Error: " + (e && e.message || e); }
      results.push({type:"tool_result", tool_use_id:u.id, content:out});
    }
    messages.push({role:"user", content:results});
  }
  throw {code:"empty_completion"};
}

/* ---------- Visuel : affiche "fight night" générée ---------- */
function drawPoster(cv, seed){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.max(300, r.width)*dpr; cv.height = Math.max(300, r.height)*dpr;
  const g = cv.getContext("2d"); const W=cv.width, H=cv.height;
  let s = seed*9301+49297; const rnd = ()=> (s = (s*9301+49297)%233280)/233280;
  g.fillStyle="#120f0f"; g.fillRect(0,0,W,H);
  // projecteur
  const cx = W*(.25+rnd()*.5), cy = -H*.1;
  const sp = g.createRadialGradient(cx,cy,10,cx,cy,H*1.1);
  sp.addColorStop(0,"rgba(215,38,46,.55)"); sp.addColorStop(.45,"rgba(120,20,24,.25)"); sp.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=sp; g.fillRect(0,0,W,H);
  // grillage de l'octogone
  g.strokeStyle="rgba(239,231,220,.09)"; g.lineWidth=1.2*dpr;
  const step = 22*dpr;
  for(let x=-H;x<W+H;x+=step){ g.beginPath(); g.moveTo(x,0); g.lineTo(x+H,H); g.stroke(); g.beginPath(); g.moveTo(x,0); g.lineTo(x-H,H); g.stroke(); }
  // octogone
  const ox=W*(.55+rnd()*.3), oy=H*(.3+rnd()*.2), R=Math.min(W,H)*(.55+rnd()*.2);
  g.strokeStyle="rgba(217,164,58,.35)"; g.lineWidth=3*dpr; g.beginPath();
  for(let i=0;i<=8;i++){ const a=Math.PI/8+i*Math.PI/4; const x=ox+R*Math.cos(a), y=oy+R*Math.sin(a); i?g.lineTo(x,y):g.moveTo(x,y); }
  g.stroke();
  g.strokeStyle="rgba(217,164,58,.15)"; g.lineWidth=1.5*dpr; g.beginPath();
  for(let i=0;i<=8;i++){ const a=Math.PI/8+i*Math.PI/4; const x=ox+R*.82*Math.cos(a), y=oy+R*.82*Math.sin(a); i?g.lineTo(x,y):g.moveTo(x,y); }
  g.stroke();
  // grain
  for(let i=0;i<1400;i++){ g.fillStyle=`rgba(255,255,255,${rnd()*.05})`; g.fillRect(rnd()*W,rnd()*H,dpr,dpr); }
}

let CIQ = null, CIQ_P = null, BYCODE = {};
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/œ/g,"oe").replace(/[^a-z0-9]+/g," ").trim();
function loadCiqual(){
  if (!CIQ_P) CIQ_P = fetch("ciqual.json").then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{
    d.foods.forEach(f=>{ f.n = " "+norm(f[1]); BYCODE[f[0]] = f; }); CIQ = d; return d;
  }).catch(e=>{ CIQ_P = null; throw e; });
  return CIQ_P;
}
function searchCiqual(q, n=8){
  if (!CIQ) return [];
  const toks = norm(q).split(" ").filter(t=>t.length>1);
  if (!toks.length) return [];
  const out = [];
  for (const f of CIQ.foods){
    let s = 0;
    for (const t of toks){
      const stem = t.length>4 ? t.replace(/(es|s|x)$/,"") : t;
      if (f.n.includes(" "+stem)) s += 2; else if (f.n.includes(stem)) s += .8; else s -= 1.5;
    }
    if (s <= 0) continue;
    if (f.n.startsWith(" "+toks[0].slice(0,5))) s += 1.2;
    s -= f.n.length/160;
    out.push([s,f]);
  }
  return out.sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}
function itemsTotals(items){
  const t = {kcal:0,p:0,c:0,f:0};
  items.forEach(it=>{ const f = BYCODE[it.code]; if(!f) return; const k = (+it.g||0)/100;
    t.kcal += f[2]*k; t.p += f[3]*k; t.c += f[4]*k; t.f += f[5]*k; });
  return t;
}

let wRange = 30;
function weightStats(){
  const w = [...profile.weights].sort((a,b)=>a.d<b.d?-1:1);
  const cur = w.length ? w[w.length-1] : null;
  const start = profile.startWeight || (w[0] && w[0].kg);
  const avg = (from,to) => { const s = w.filter(x=>x.d>from && x.d<=to); return s.length ? s.reduce((a,x)=>a+x.kg,0)/s.length : null; };
  const today = dkey();
  const a1 = avg(dkey(addDays(new Date(),-7)), today), a0 = avg(dkey(addDays(new Date(),-14)), dkey(addDays(new Date(),-7)));
  const rate = (a1!==null && a0!==null) ? a1 - a0 : null;
  return {w, cur, start, rate, a1};
}
function movingAvg(w){ // moyenne glissante 7 jours
  return w.map(x=>{ const from = dkey(addDays(parseKey(x.d),-6)); const s = w.filter(y=>y.d>=from && y.d<=x.d); return {d:x.d, kg: s.reduce((a,y)=>a+y.kg,0)/s.length}; });
}
function weeksSummary(w){
  const wk = {};
  w.forEach(x=>{ const dt = parseKey(x.d); const mon = addDays(dt, -((dt.getDay()+6)%7)); const k = dkey(mon); (wk[k] = wk[k]||[]).push(x.kg); });
  const keys = Object.keys(wk).sort();
  return keys.map((k,i)=>{ const a = wk[k].reduce((s,v)=>s+v,0)/wk[k].length; const prev = i ? wk[keys[i-1]].reduce((s,v)=>s+v,0)/wk[keys[i-1]].length : null; return {k, avg:a, delta: prev===null?null:a-prev, n:wk[k].length}; }).reverse();
}
function viewWeight(){

  const cw = cur ? cur.kg : start;
  const lost = (start && cw) ? start - cw : null;
  const left = (goal && cw) ? cw - goal : null;
  const total = (start && goal) ? start - goal : null;
  const pct = (total && lost!==null) ? Math.max(0, Math.min(1, lost/total)) : null;
  let pace = "", proj = "";
  if (rate !== null && cw){

    ${need!==null ? `<div class="${need/cw*100>1?"note":"note good"}">Il faut ${fmt1(need)} kg/semaine pour y être à temps${need/cw*100>1?" : c'est plus de 1 % par semaine, à valider avec ton coach.":"."}</div>`:""}</section>`;

    <div class="grid3">

      <div class="stat"><span class="lbl">Record sem.</span><span class="num" style="font-size:24px;color:var(--gold)">${best?fmt1(best.delta):"–"}</span></div>
    </div>
    ${pace}
    ${proj?`<p class="small" style="margin:0">À ce rythme, objectif atteint vers le <b>${parseKey(proj).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}</b>.</p>`:""}
  </section>

    <button class="btn red" data-act="addWeight">Enregistrer</button>
  </section>
  ${countdown}
  <section class="card">
    <div class="row between"><h2>Photos de progression</h2><label class="btn sm red" for="ppIn">+ Photo</label></div>
    <input type="file" id="ppIn" accept="image/*" class="hidden">
    ${pp.length>=2 ? `<div class="ba"><figure><img src="${esc(pp[0].url)}" alt="Photo du ${pp[0].d}"><figcaption>${parseKey(pp[0].d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</figcaption></figure><figure><img src="${esc(pp[pp.length-1].url)}" alt="Photo du ${pp[pp.length-1].d}"><figcaption>${parseKey(pp[pp.length-1].d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</figcaption></figure></div>`
      : `<p class="small muted" style="margin:0">Une photo par semaine, même lumière, même pose, même heure. La balance ment parfois, les photos rarement. ${pp.length===1?"Ajoute la suivante dans une semaine pour voir l'avant / après.":""}</p>`}
    ${pp.length?`<div class="gallery">${pp.map((p,i)=>`<figure><img src="${esc(p.url)}" alt="Progression ${p.d}"><button class="x" data-act="delPP" data-i="${i}" aria-label="Retirer la photo">×</button></figure>`).join("")}</div>`:""}

function drawChart(){
  const cv = $("#wchart"); if(!cv) return;
  let w = [...profile.weights].sort((a,b)=>a.d<b.d?-1:1);
  const ma = movingAvg(w);
  const from = wRange ? dkey(addDays(new Date(), -wRange)) : "0000";
  const wv = w.filter(x=>x.d>=from), mv = ma.filter(x=>x.d>=from);
  const dpr = Math.min(2, devicePixelRatio||1), r = cv.getBoundingClientRect();
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const g = cv.getContext("2d"); g.scale(dpr,dpr);
  const W=r.width, H=r.height, L=34, R=12, T=14, B=22;
  if (wv.length < 2){ g.fillStyle="#a39890"; g.font="15px 'Barlow Semi Condensed', sans-serif"; g.fillText("En attente de pesées sur cette période", L, H/2); return; }
  const goal = profile.goalWeight;
  // projection vers l'objectif
  const {rate} = weightStats(); let projPt = null;
  if (goal && rate!==null && rate < -0.05){ const last = mv[mv.length-1]; const days = Math.round((last.kg-goal)/(-rate)*7); if (days>0 && days<200) projPt = {d:dkey(addDays(parseKey(last.d),days)), kg:goal}; }
  const vals = wv.map(x=>x.kg).concat(goal?[goal]:[]);
  const lo = Math.floor(Math.min(...vals)-.5), hi = Math.ceil(Math.max(...vals)+.5);
  const t0 = parseKey(wv[0].d).getTime(), tEnd = parseKey((projPt||wv[wv.length-1]).d).getTime();
  const X = d => L + (parseKey(d).getTime()-t0)/Math.max(1,tEnd-t0)*(W-L-R);
  const Y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  g.font="12px 'Barlow Semi Condensed', sans-serif"; g.strokeStyle="#2c2827"; g.lineWidth=1; g.fillStyle="#a39890";
  const stepV = Math.max(1, Math.round((hi-lo)/4));
  for(let v=lo; v<=hi; v+=stepV){ g.beginPath(); g.moveTo(L,Y(v)); g.lineTo(W-R,Y(v)); g.stroke(); g.fillText(v, 4, Y(v)+4); }
  const lab = d => parseKey(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  g.fillText(lab(wv[0].d), L, H-5); const le = lab((projPt||wv[wv.length-1]).d); g.fillText(le, W-R-g.measureText(le).width, H-5);
  if (goal){ g.setLineDash([4,5]); g.strokeStyle="#d9a43a"; g.beginPath(); g.moveTo(L,Y(goal)); g.lineTo(W-R,Y(goal)); g.stroke(); g.setLineDash([]); }
  // aire sous la moyenne
  const grad = g.createLinearGradient(0,T,0,H-B); grad.addColorStop(0,"rgba(215,38,46,.38)"); grad.addColorStop(1,"rgba(215,38,46,0)");
  g.beginPath(); mv.forEach((x,i)=> i?g.lineTo(X(x.d),Y(x.kg)):g.moveTo(X(x.d),Y(x.kg)));
  g.lineTo(X(mv[mv.length-1].d),H-B); g.lineTo(X(mv[0].d),H-B); g.closePath(); g.fillStyle=grad; g.fill();
  // pesées
  g.fillStyle="rgba(239,231,220,.45)"; wv.forEach(x=>{ g.beginPath(); g.arc(X(x.d),Y(x.kg),2.6,0,7); g.fill(); });
  // moyenne
  g.beginPath(); mv.forEach((x,i)=> i?g.lineTo(X(x.d),Y(x.kg)):g.moveTo(X(x.d),Y(x.kg)));
  g.strokeStyle="#d7262e"; g.lineWidth=3; g.lineJoin="round"; g.stroke();
  const last = mv[mv.length-1];
  if (projPt){ g.setLineDash([2,5]); g.strokeStyle="rgba(217,164,58,.8)"; g.lineWidth=2; g.beginPath(); g.moveTo(X(last.d),Y(last.kg)); g.lineTo(X(projPt.d),Y(projPt.kg)); g.stroke(); g.setLineDash([]);
    g.fillStyle="#d9a43a"; g.beginPath(); g.arc(X(projPt.d),Y(projPt.kg),5,0,7); g.fill(); }
  g.beginPath(); g.arc(X(last.d),Y(last.kg),6,0,7); g.fillStyle="#efe7dc"; g.fill(); g.lineWidth=3; g.strokeStyle="#d7262e"; g.stroke();
}
function mindIntro(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const q = quoteOfDay(), words = q[0].split(" ");
  const ph = profile.photos.length ? profile.photos[Math.floor(Date.now()/864e5) % profile.photos.length] : null;
  const el = document.createElement("div"); el.id = "intro"; el.className = "player intro";
  el.innerHTML = `${ph ? `<img class="ibg" src="${esc(ph.url)}" alt="">` : `<canvas class="ibg" id="introBg"></canvas>`}<div class="ishade"></div>
    <div class="iq">${words.map((w,i)=>`<span style="animation-delay:${.35 + i*.12}s">${esc(w)}</span>`).join(" ")}</div>
    <div class="ia" style="animation-delay:${.5 + words.length*.12}s"><i></i>${esc(q[1])}</div>
    <div class="ihint" style="animation-delay:${1.2 + words.length*.12}s">Glisse ou touche pour continuer</div>`;
  document.body.appendChild(el);
  const cv = document.getElementById("introBg"); if (cv){ cv.width = innerWidth; cv.height = innerHeight; bgOctagon(cv.getContext("2d"), innerWidth, innerHeight, Math.floor(Date.now()/864e5), true); }
  let gone = false; const close = () => { if (gone) return; gone = true; el.classList.add("out"); setTimeout(()=>el.remove(), 550); };
  el.addEventListener("click", close); el.addEventListener("touchmove", close, {passive:true}); el.addEventListener("wheel", close, {passive:true});
  setTimeout(close, 3200 + words.length*120);
}

function beep(f=880, ms=140){ try{ if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=f; g.gain.value=.15; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+ms/1000);}catch(e){} }
function startRoutine(id){

  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}

  openPlayer(); clearInterval(player.tm); player.tm = setInterval(tickPlayer, 1000);
}
function tickPlayer(){
  if (!player || !player.running) return;
  if (player.prep > 0){ player.prep--; if (player.prep===0) beep(1200,220); paintPlayer(); return; }
  player.left--;
  if (player.left <= 3 && player.left > 0) beep(660,90);
  if (player.left <= 0){ nextStep(); return; }
  paintPlayer();
}
function nextStep(){
  if (player.i >= player.steps.length-1){ finishRoutine(); return; }
  player.i++; player.left = player.steps[player.i].sec; player.prep = 5; beep(990,200); paintPlayer();
}
function prevStep(){ if (player.i>0){ player.i--; } player.left = player.steps[player.i].sec; player.prep = 3; player.painted = -1; paintPlayer(); }
function finishRoutine(){
  const d = day(); d.stretch = (d.stretch||[]).concat(player.r.id); 
  if (profile.habits.find(h=>h.id==="h_flex")) d.habits.h_flex = true;
  saveDay(); closePlayer(); toast("Routine terminée. Tes hanches te remercient."); render();
}

function loadPdfJs(){
  if (!pdfjsP) pdfjsP = new Promise((res,rej)=>{ const sc = document.createElement("script"); sc.src = "lib/pdf.min.js";
    sc.onload = ()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js"; res(window.pdfjsLib); }; sc.onerror = ()=>{ pdfjsP=null; rej(); }; document.head.appendChild(sc); });
  return pdfjsP;
}
async function pdfToImages(file, max){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: await file.arrayBuffer()}).promise;
  const out = [];
  for (let i=1; i<=Math.min(doc.numPages, max); i++){
    const page = await doc.getPage(i); const v1 = page.getViewport({scale:1});
    const vp = page.getViewport({scale: Math.min(2, 1300/v1.width)});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:g, viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.85)));
  }
  return {images:out, pages:doc.numPages};
}

function planOccurrences(fromKey, toKey){

      ${defi.u==="s" && !done ? `<button class="btn red" data-act="defiRun">${defi.run?"Pause":"Chrono"}</button>` : `<button class="btn red" data-act="defiDone">${done?"Valider":"J'ai fini"}</button>`}
    </div>`;
}
function closeDefi(){ if (defi && defi.tm) clearInterval(defi.tm); defi = null; const el = document.getElementById("defi"); if (el) el.remove(); }
function finishDefi(){
  const d = day(); d.defis = (d.defis||[]).filter(x=>x.key!==defi.key).concat({key:defi.key, n:defi.n, q:defi.q, u:defi.u, t:Date.now()});
  saveDay(); closeDefi(); toast("Défi validé"); render();
}
function handleRoute(){
  const q = new URLSearchParams(location.search);
  if (q.has("defi")) openDefi(q.get("defi"));
  if (q.has("meal")){ ui.mealType = q.get("meal"); ui.fdate = dkey(); foodSub = "log"; ui.addMode = "photo"; }
  const g = q.get("go");
  if (g==="flex"){ trainSub = "flex"; tab = "train"; }
  else if (g==="train"){ trainSub = "prog"; tab = "train"; }
  else if (g && ["today","food","weight","mind","setup"].includes(g)) tab = g;
  if (g==="food") foodSub = "log";
  if (q.toString()) history.replaceState(null, "", location.pathname);
}
navigator.serviceWorker && navigator.serviceWorker.addEventListener("message", e=>{
  if (e.data && e.data.type==="open"){ const u = new URL(e.data.url, location.href); history.replaceState(null,"", u.pathname + u.search); handleRoute(); render(); }
});

/* ---------- Rendu ---------- */
function render(){
  $("#hdate").textContent = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  document.querySelectorAll("#nav button").forEach(b=> b.dataset.tab===tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  const v = $("#view");
  v.innerHTML = tab==="today" ? viewToday() : tab==="food" ? viewFood() : tab==="weight" ? viewWeight() : tab==="mind" ? viewMind() : tab==="train" ? viewTraining() : viewSetup();

  const seed = Math.floor(Date.now()/864e5) + quoteOffset;
  ["pc","pm"].forEach(id=>{ const c=document.getElementById(id); if(c) drawPoster(c, seed); });
  drawChart();
  if (ui.ciqQ && document.getElementById("ciqRes")) paintCiq();
  if (tab==="today") animateHero();
  if (tab==="mind" && !wall.url && !wall.pending){ wall.pending = true; refreshWallpaper().finally(()=>wall.pending=false); }
  if (tab==="mind") buildThumbs();
}
function go(t){ const prev = tab; tab=t; render(); window.scrollTo(0,0); if (t==="mind" && prev!=="mind") mindIntro(); }

/* ---------- Actions ---------- */
function addWeight(kg, d){
  if (!kg || kg<30 || kg>250){ toast("Poids invalide"); return; }
  profile.weights = profile.weights.filter(x=>x.d!==d).concat({d, kg});
  if (!profile.startWeight) profile.startWeight = kg;
  if (d===dkey()){ const h = profile.habits.find(h=>h.id==="h_weigh"); if (h){ day().habits.h_weigh = true; saveDay(); } }
  saveProfile(); render(); toast("Pesée enregistrée");
}

document.addEventListener("click", async e=>{
  const nb = e.target.closest("#nav button"); if (nb){ go(nb.dataset.tab); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i;
  const d = day();
  switch(a){
    case "signup": doSignUp(); break;
    case "syncNow": if (store.uid){ setSync("loading"); await flushDirty(); await pullAll(); toast("Synchronisé"); } else showAuth(); break;
    case "drink": { const wd = tab==="food" ? day(fdate()) : day(); const ml = cMl(b.dataset.v); wd.water = (wd.water||0) + ml; wd.waterLog = (wd.waterLog||[]).concat({t:Date.now(), ml, c:b.dataset.v});
      if (wd.water >= targets().water && profile.habits.find(h=>h.id==="h_water")) wd.habits.h_water = true;
      saveDay(tab==="food" ? fdate() : dkey()); if (navigator.vibrate) navigator.vibrate(12); render(); toast(`+${ml>=1000?fmt1(ml/1000)+" L":Math.round(ml/10)+" cl"} · ${fmt1(wd.water/1000)} L`); break; }
    case "drinkUndo": { const wd = tab==="food" ? day(fdate()) : day(); const last = (wd.waterLog||[]).pop(); if (last){ wd.water = Math.max(0, (wd.water||0) - last.ml); saveDay(tab==="food" ? fdate() : dkey()); render(); } break; }
    case "goPlan": trainSub = "plan"; go("train"); break;
    case "pushOn": enablePush(); break;
    case "pushTest": testPush(); break;
    case "pfKind": planForm.kind = b.dataset.v; planForm.ref = b.dataset.v==="flex" ? "high" : 0; render(); break;
    case "planAdd": {
      const f = planForm; if (!f.date || !f.time){ toast("Choisis un jour et une heure"); return; }
      if (f.kind==="prog" && !profile.program){ toast("Importe d'abord ton programme"); return; }
      profile.plan = (profile.plan||[]).concat({id:"p"+uid(), kind:f.kind, ref:f.kind==="prog"?+f.ref:f.ref, title:f.title.trim(), date:f.date, time:f.time, dur:+f.dur||60, repeat:!!f.repeat, weeks:+f.weeks||8, remind:+f.remind||0, ex:[]});
      saveProfile(); scheduleNotifSync(); render(); toast("Séance programmée"); break; }
    case "planDel": profile.plan = (profile.plan||[]).filter(p=>p.id!==b.dataset.id); saveProfile(); scheduleNotifSync(); render(); break;
    case "planSkip": { const p = (profile.plan||[]).find(x=>x.id===b.dataset.id); if (p){ p.ex = (p.ex||[]).concat(b.dataset.d); saveProfile(); scheduleNotifSync(); render(); toast("Séance sautée"); } break; }
    case "icsExport": try{ await downloadsCap.save({filename:"fight-camp-seances.ics", data:new Blob([icsText()], {type:"text/calendar"})}); }catch(err){} break;
    case "defiNow": openDefi(null); break;
    case "defiTap": if (navigator.vibrate) navigator.vibrate(15); defi.count++; paintDefi(); break;
    case "defiRun": defi.run = !defi.run; clearInterval(defi.tm); if (defi.run){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} defi.tm = setInterval(()=>{ defi.left--; if (defi.left<=3 && defi.left>0) beep(660,90); if (defi.left<=0){ clearInterval(defi.tm); beep(1200,300); } paintDefi(); }, 1000); } paintDefi(); break;
    case "defiDone": finishDefi(); break;
    case "defiClose": closeDefi(); break;
    case "copyDefi": try{ await navigator.clipboard.writeText($("#defiLink").value); toast("Lien copié"); }catch(err){ $("#defiLink").select(); } break;
    case "logout": await sb.auth.signOut(); break;
    case "importData": {
      try{ const j = JSON.parse($("#imp").value); if (!j.profile) throw 0;
        profile = Object.assign(profile, j.profile); saveProfile();
        Object.entries(j.days||{}).forEach(([k,v])=>{ days[k] = Object.assign({habits:{},meals:[],water:0}, v); saveDay(k); });
        migrate(); render(); toast("Données importées");
      }catch(err){ toast("Texte non reconnu : colle le JSON copié depuis l'ancienne version"); } break; }
    case "go": if (b.dataset.tab==="food") foodSub = "log"; go(b.dataset.tab); break;
    case "foodSub": foodSub = b.dataset.v; render(); break;
    case "trainSub": trainSub = b.dataset.v; render(); break;
    case "goFlex": trainSub = "flex"; go("train"); break;
    case "goProg": trainSub = "prog"; go("train"); break;
    case "goWall": go("mind"); setTimeout(()=>{ const w = document.getElementById("wallpaper"); if (w) w.scrollIntoView({behavior:"smooth"}); }, 60); break;
    case "startRoutine": startRoutine(b.dataset.id); break;
    case "ytPlay": { if (player && player.running){ player.running = false; paintPlayer(); } b.outerHTML = ytFrame(b.dataset.v); break; }
    case "plClose": closePlayer(); break;
    case "plNext": nextStep(); break;
    case "plPrev": prevStep(); break;
    case "plPause": player.running = !player.running; paintPlayer(); break;
    case "progStop": prog.ctl && prog.ctl.abort(); break;
    case "pickSession": d.training = {idx:i, logs:{}}; saveDay(); render(); break;
    case "askLoad": askLoad(+b.dataset.s, i); break;
    case "feel": { const tr = ensureTraining(); tr.logs[i] = Object.assign(tr.logs[i]||{}, {feel:b.dataset.v}); saveDay(); render(); break; }
    case "finishSession": {
      const tr = ensureTraining(), s = profile.program.seances[tr.idx]; profile.lifts = profile.lifts || {};
      let n = 0;
      Object.entries(tr.logs).forEach(([ei,lg])=>{ const e = s.exercices[+ei]; if (!e || !lg.kg) return; const k = exKey(e);
        profile.lifts[k] = (profile.lifts[k]||[]).filter(x=>x.d!==dkey()).concat({d:dkey(), kg:lg.kg, reps:lg.reps||"", feel:lg.feel||""}).slice(-12); n++; });
      tr.done = true; if (profile.habits.find(h=>h.id==="h_train")) d.habits.h_train = true;
      saveDay(); saveProfile(); render(); toast(n ? "Séance validée. Charges enregistrées." : "Séance validée."); break; }
    case "wallMode": wall.mode = b.dataset.v; render(); refreshWallpaper(); break;
    case "wallNextQ": { const n = allQuotes().length; wall.qi = ((wall.qi===null ? allQuotes().indexOf(quoteOfDay()) : wall.qi) + 1) % n; render(); refreshWallpaper(); break; }
    case "wallPreset": { const p = PRESETS().find(x=>x.id===b.dataset.id); if (!p) return; Object.assign(wall, {mode:"quote", fig:"none", word:0, qi:null}, p.o); render(); refreshWallpaper(); document.getElementById("wpImg")?.scrollIntoView({behavior:"smooth", block:"center"}); break; }
    case "dwPrepare": prepareDailyWalls(true); break;
    case "dwCopy": { const t = await wallToken().catch(()=>null); if (!t) return; try{ await navigator.clipboard.writeText(WALL_FN + t); toast("Lien copié"); }catch(err){ toast("Copie refusée"); } break; }
    case "wallFig": wall.fig = b.dataset.v; render(); refreshWallpaper(); break;
    case "wallNextW": wall.word = ((wall.word||0) + 1) % WORDS.length; render(); refreshWallpaper(); break;
    case "wallBg": wall.bg = b.dataset.v; render(); refreshWallpaper(); break;
    case "wallSave": if (!wall.blob) return; try{ await downloadsCap.save({filename:"fight-camp-fond-ecran.png", data:wall.blob}); }catch(err){ if (!err || err.code!=="declined") toast("Enregistrement impossible : fais un appui long sur l'aperçu."); } break;
    case "aiStop": ai.ctl && ai.ctl.abort(); break;
    case "ciqAdd": { const code = +b.dataset.code; if (!draft) draft = {name: BYCODE[code] ? BYCODE[code][1].split(",")[0] : "Repas", items:[], conf:"", note:"", type: ui.mealType};
      draft.items.push({code, g:100, label:""}); render(); toast("Ajouté : règle les grammes"); setTimeout(()=>document.getElementById("draftCard")?.scrollIntoView({behavior:"smooth", block:"start"}), 60); break; }
    case "draftDel": draft.items.splice(i,1); if(!draft.items.length) draft=null; render(); break;
    case "draftCancel": draft = null; render(); break;
    case "draftAdd": { const name = ($("#dr_name").value||"Repas").trim(); const m = Object.assign(mealFromItems(name, draft.items), {type: draft.type || ui.mealType});
      day(fdate()).meals.push(m); saveDay(fdate()); ui.ciqQ = "";
      if ($("#dr_fav").checked && !profile.favorites.some(x=>x.name===m.name)){ profile.favorites.push(m); saveProfile(); }
      draft = null; render(); toast(`${fmt0(m.kcal)} kcal ajoutées`); break; }
    case "chefMeal": chef.meal = b.dataset.v; render(); break;
    case "chefStyle": { const v = b.dataset.v; chef.styles = chef.styles.includes(v) ? chef.styles.filter(x=>x!==v) : chef.styles.concat(v); render(); break; }
    case "chefGo": askChef(); break;
    case "dishEat": { const p = dishFromRef(b); const dk = b.dataset.k==="plan" ? profile.mealPlan.days[+b.dataset.d].date : dkey();
      const ty = p.type ? typeFromLabel(p.type) : typeFromLabel(chef.meal);
      day(dk).meals.push(Object.assign(mealFromItems(p.nom, p.items), {type: ty})); saveDay(dk); render(); toast(`Ajouté en ${mealLabel(ty).toLowerCase()}`); break; }
    case "dishSave": { profile.recipes = (profile.recipes||[]).concat(JSON.parse(JSON.stringify(dishFromRef(b)))); saveProfile(); toast("Recette gardée"); break; }
    case "tipsAI": aiTips(); break;
    case "tipsReset": delete day().tips; saveDay(); render(); break;
    case "chefMode": chef.mode = b.dataset.v; ai.err = ""; render(); break;
    case "planGo": runPlanner((chef.mode||"one")==="week" ? 7 : 1); break;
    case "planClear": profile.mealPlan = null; saveProfile(); render(); break;
    case "fpToggle": { const f = foodProfile(), k = b.dataset.k, v = b.dataset.v; f[k] = f[k].includes(v) ? f[k].filter(x=>x!==v) : f[k].concat(v); saveProfile(); render(); break; }
    case "shopCopy": { const pl = profile.mealPlan; if (!pl) return; const txt = shoppingList(pl).map(([g,l])=>g.toUpperCase()+"\n"+l.filter(x=>!(pl.checked||{})[x.code]).map(x=>"- "+x.nom+" : "+qty(x.g)).join("\n")).join("\n\n");
      try{ await navigator.clipboard.writeText(txt); toast("Liste copiée"); }catch(err){ toast("Copie refusée"); } break; }
    case "dishDel": profile.recipes.splice(i,1); saveProfile(); render(); break;
    case "nextQuote": quoteOffset++; wall.url = null; render(); break;
    case "water": { const wd = tab==="food" ? day(fdate()) : d; wd.water = Math.max(0, wd.water + (+b.dataset.v)); if (wd!==d){ saveDay(fdate()); render(); break; } }
      if (d.water >= targets().water && profile.habits.find(h=>h.id==="h_water")) d.habits.h_water = true;
      saveDay(); render(); break;
    case "addWeightQuick": addWeight(num($("#qw").value), dkey()); break;
    case "addWeight": addWeight(num($("#w_kg").value), $("#w_d").value || dkey()); break;
    case "delWeight": profile.weights = profile.weights.filter(x=>x.d!==b.dataset.d); saveProfile(); render(); break;
    case "wRange": wRange = +b.dataset.v; render(); break;
    case "delPP": { const p = profile.progressPhotos.splice(i,1)[0]; saveProfile(); render(); if (p && p.id && assets){ try{ await assets.delete(p.id); }catch(err){} } break; }
    case "setClass": profile.weightClass = b.dataset.n; profile.goalWeight = +b.dataset.kg; saveProfile(); render(); toast(`Objectif : ${b.dataset.n}`); break;
    case "delMeal": { const fd = day(fdate()); const m = fd.meals.splice(i,1)[0]; ui.openMeal = null; saveDay(fdate()); render(); if (m) toast("Supprimé : " + m.name); break; }
    case "addFav": { const f = profile.favorites[i]; day(fdate()).meals.push({...f, type: ui.mealType||defaultMealType()}); saveDay(fdate()); render(); toast(`Ajouté en ${mealLabel(ui.mealType).toLowerCase()}`); break; }
    case "mType": ui.mealType = b.dataset.v; render(); break;

    case "addMode": ui.addMode = b.dataset.v; render(); if (b.dataset.v==="search") setTimeout(()=>{ const q = $("#ciqQ"); if (q) q.focus(); }, 50); break;
    case "fday": { const nd = dkey(addDays(parseKey(fdate()), +b.dataset.v)); ui.fdate = nd > dkey() ? dkey() : nd; ui.openMeal = null; render(); break; }
    case "mealOpen": ui.openMeal = ui.openMeal===i ? null : i; render(); break;
    case "mealMove": { const fd = day(fdate()); if (fd.meals[i]){ fd.meals[i].type = b.dataset.v; saveDay(fdate()); } render(); break; }
    case "mealFav": { const m = day(fdate()).meals[i]; if (m && !profile.favorites.some(x=>x.name===m.name)){ const {type, ...rest} = m; profile.favorites.push(rest); saveProfile(); toast("Ajouté aux favoris"); } render(); break; }
    case "delFav": profile.favorites.splice(i,1); saveProfile(); render(); break;
    case "addHabit": { const v = $("#h_new").value.trim(); if(!v) return; profile.habits.push({id:"h_"+uid(), label:v}); saveProfile(); render(); break; }
    case "delHabit": profile.habits.splice(i,1); saveProfile(); render(); break;
    case "addQuote": { const t = $("#q_t").value.trim(); if(!t) return; profile.extraQuotes.push({t, a:$("#q_a").value.trim()}); saveProfile(); render(); toast("Citation ajoutée"); break; }
    case "delQuote": profile.extraQuotes.splice(i,1); saveProfile(); render(); break;
    case "delPhoto": { const p = profile.photos.splice(i,1)[0]; saveProfile(); render();
      if (p && p.id && assets){ try{ await assets.delete(p.id); }catch(err){} } break; }
    case "copyData": try{ await navigator.clipboard.writeText(JSON.stringify({profile, days}, null, 1)); toast("Copié"); }catch(err){ toast("Copie refusée par le navigateur"); } break;
  }
});

document.addEventListener("change", async e=>{
  const el = e.target;
  if (el.dataset.habit){ day().habits[el.dataset.habit] = el.checked; saveDay();
    const done = profile.habits.filter(h=>day().habits[h.id]).length;
    if (el.checked && done === profile.habits.length) toast("Journée gagnée. Round suivant demain.");
    render(); return; }
  if (el.dataset.field){
    const f = el.dataset.field; let v = el.value;
    if (["age","height","startWeight","goalWeight","activity","deficit","kcalOverride","protOverride","aiBudget"].includes(f)) v = num(v);
    profile[f] = v; if (f==="goalWeight") profile.weightClass = "";
    saveProfile(); render(); return; }
  if (el.dataset.fp){ const f = foodProfile(), k = el.dataset.fp; f[k] = (k==="maxTime"||k==="mealsPerDay") ? +el.value : el.value.trim(); saveProfile(); return; }
  if (el.dataset.chef){ chef[el.dataset.chef] = el.value; return; }
  if (el.dataset.shop){ const pl = profile.mealPlan; if (pl){ pl.checked = pl.checked||{}; pl.checked[el.dataset.shop] = el.checked; saveProfile(); } return; }
  if (el.dataset.pf){ const k = el.dataset.pf; planForm[k] = el.type==="checkbox" ? el.checked : el.value; if (k==="weeks"||k==="dur"||k==="remind") planForm[k] = +el.value||0; return; }
  if (el.dataset.hy){ hydraCfg()[el.dataset.hy] = el.value; saveProfile(); scheduleNotifSync(); render(); return; }
  if (el.dataset.mt){ mealTimes()[el.dataset.mt] = el.value; saveProfile(); scheduleNotifSync(); return; }
  if (el.dataset.nf){ const c = notifCfg(), k = el.dataset.nf; c[k] = el.type==="checkbox" ? (k==="eau" ? (el.checked ? "plan" : "") : el.checked) : (k==="defisN" ? +el.value : el.value); saveProfile(); scheduleNotifSync(); if (tab==="today"||el.type==="checkbox") render(); return; }
  if (el.dataset.dg !== undefined && draft){ draft.items[+el.dataset.dg].g = Math.max(0, Math.round(num(el.value)||0)); draft.name = ($("#dr_name")||{}).value || draft.name; render(); return; }
  if (el.id === "dishIn"){ const f = el.files[0]; el.value = ""; if (f){ if (tab!=="food"){ ui.mealType = defaultMealType(); ui.fdate = dkey(); } tab = "food"; foodSub = "log"; ui.addMode = "photo"; analyzePhoto(f); } return; }
  if (el.id === "progIn"){ const fs = [...el.files]; el.value = ""; if (fs.length) importProgram(fs); return; }
  if (el.dataset.log !== undefined){ const tr = ensureTraining(); const ei = +el.dataset.log; tr.logs[ei] = Object.assign(tr.logs[ei]||{}, {[el.dataset.f]: el.dataset.f==="kg" ? num(el.value) : el.value.trim()}); saveDay(); return; }
  if (el.id === "ppIn"){ const f = el.files[0]; el.value=""; if (!f) return; toast("Envoi…");
    try{ const blob = await shrink(f, 1200); let ph;
      if (assets){ const r = await assets.upload(blob); ph = {id:r.id, url:r.url, d:dkey()}; }
      else { ph = {id:null, url: await toDataURL(await shrink(f, 480)), d:dkey()}; }
      profile.progressPhotos = (profile.progressPhotos||[]).concat(ph); saveProfile(); render(); toast("Photo ajoutée");
    }catch(err){ toast("Photo refusée : essaie un JPG ou PNG plus léger"); } return; }
  if (el.id === "photoIn"){
    const files = [...el.files]; if(!files.length) return;
    toast("Envoi…");
    for (const file of files){
      try{
        const blob = await shrink(file, 1200);
        if (assets){ const r = await assets.upload(blob); profile.photos.push({id:r.id, url:r.url}); }
        else { const small = await shrink(file, 480); profile.photos.push({id:null, url: await toDataURL(small)}); }
      }catch(err){ toast("Photo refusée : essaie un JPG ou PNG plus léger"); }
    }
    saveProfile(); render(); toast("Photo ajoutée");
    if (profile.dailyWall && profile.dailyWall.on) setTimeout(()=>prepareDailyWalls(true), 1500);
  }
});
document.addEventListener("submit", e=>{
  if (e.target.id === "authForm"){ e.preventDefault(); doSignIn(); return; }
  if (e.target.id !== "mealForm") return;
  e.preventDefault();
  const p = num($("#m_p").value)||0, c = num($("#m_c").value)||0, f = num($("#m_f").value)||0;
  const kcal = num($("#m_k").value) ?? Math.round(p*4 + c*4 + f*9);
  const meal = {name: $("#m_name").value.trim() || "Repas", p, c, f, kcal, type: ui.mealType || defaultMealType()};
  day(fdate()).meals.push(meal); saveDay(fdate());
  if ($("#m_fav").checked && !profile.favorites.some(x=>x.name===meal.name)){ const {type, ...rest} = meal; profile.favorites.push(rest); saveProfile(); }
  render(); toast(`${fmt0(kcal)} kcal ajoutées`);
});

function shrink(file, max){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = img.width*s; c.height = img.height*s;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=> b?res(b):rej(), "image/jpeg", .82); };
    img.onerror = rej; img.src = url;
  });
}
function toDataURL(blob){ return new Promise(r=>{ const fr = new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); }); }

document.addEventListener("input", e=>{
  if (e.target.id === "ciqQ"){ ui.ciqQ = e.target.value; clearTimeout(window._cq); window._cq = setTimeout(paintCiq, 180); }
